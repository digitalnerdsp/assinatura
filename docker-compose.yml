# Deploy no Coolify: Resource -> Docker Compose (build pack) apontando para este repositório.
# Defina as variáveis abaixo na aba Environment Variables do Coolify (veja docs/DEPLOY.md).
# Associe o domínio ao serviço "app" (porta 8080).

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Assinaturas}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?defina APP_KEY}
  APP_URL: ${APP_URL:?defina APP_URL}
  APP_LOCALE: pt_BR
  APP_FALLBACK_LOCALE: pt_BR
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-assinatura}
  DB_USERNAME: ${DB_USERNAME:-assinatura_app}
  DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "true"
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-nao-responda@example.com}
  MAIL_FROM_NAME: ${APP_NAME:-Assinaturas}
  SIGNING_PLATFORM_PROVIDER: ${SIGNING_PLATFORM_PROVIDER:-local_test}
  SIGNING_ALLOW_LOCAL_TEST: ${SIGNING_ALLOW_LOCAL_TEST:-false}
  SIGNING_PLATFORM_A1_SECRET_REF: ${SIGNING_PLATFORM_A1_SECRET_REF:-ecnpj}
  SEALER_URL: http://sealer:8080
  SEALER_TOKEN: ${SEALER_TOKEN:?defina SEALER_TOKEN}
  SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
  SIGNING_MAX_PDF_MB: ${SIGNING_MAX_PDF_MB:-20}
  PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-25M}   # >= SIGNING_MAX_PDF_MB
  PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-30M}
  MESSAGING_DRIVER: ${MESSAGING_DRIVER:-log}              # log | twilio (WhatsApp/SMS)
  TWILIO_SID: ${TWILIO_SID:-}
  TWILIO_TOKEN: ${TWILIO_TOKEN:-}
  TWILIO_FROM_SMS: ${TWILIO_FROM_SMS:-}
  TWILIO_FROM_WHATSAPP: ${TWILIO_FROM_WHATSAPP:-}
  SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  BACKUP_PATH: /backups

services:
  app:
    build: .
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "true"        # roda as migrations ao subir
    volumes:
      - documents:/var/www/html/storage/app
      - backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build: .
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=5", "--max-time=3600", "--sleep=3"]
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "false"
    volumes:
      - documents:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Agendador: expira envelopes vencidos e envia lembretes (php artisan schedule:work roda a cada minuto).
  scheduler:
    build: .
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "false"
    volumes:
      - documents:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Backup diário do banco (pg_dump comprimido) e dos documentos; mantém os últimos BACKUP_RETENTION_DAYS dias.
  # Copie o volume "backups" para fora do servidor (S3/Coolify Backups) — veja docs/DEPLOY.md.
  backup:
    image: postgres:17
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date -u +%Y%m%d-%H%M%S)
          # grava em arquivo (não em pipe) para detectar falha do pg_dump
          if pg_dump -h db -U "$$PGUSER" -d "$$PGDATABASE" -f /backups/db-$$ts.sql.tmp && gzip -f /backups/db-$$ts.sql.tmp && mv /backups/db-$$ts.sql.tmp.gz /backups/db-$$ts.sql.gz; then
            echo "backup do banco ok: db-$$ts.sql.gz"
          else
            rm -f /backups/db-$$ts.sql.tmp /backups/db-$$ts.sql.tmp.gz; echo "FALHA no backup do banco" >&2
          fi
          tar -czf /backups/documents-$$ts.tar.gz -C /documents . && echo "backup dos documentos ok" || echo "FALHA no backup dos documentos" >&2
          find /backups -type f \( -name "db-*.sql.gz" -o -name "documents-*.tar.gz" \) -mtime +$${BACKUP_RETENTION_DAYS:-14} -delete
          sleep $${BACKUP_INTERVAL_SECONDS:-86400}
        done
    environment:
      PGUSER: ${DB_USERNAME:-assinatura_app}
      PGPASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      PGDATABASE: ${DB_DATABASE:-assinatura}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - backups:/backups
      - documents:/documents:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  sealer:
    build: ./sealer
    environment:
      SEALER_TOKEN: ${SEALER_TOKEN:?defina SEALER_TOKEN}
      SEALER_ALLOW_TEST: ${SIGNING_ALLOW_LOCAL_TEST:-false}
      SEALER_TSA_URL: ${SEALER_TSA_URL:-}
      # e-CNPJ A1 (ICP-Brasil): o .pfx em base64 e a senha. Só o sealer enxerga; o nome do meio (ECNPJ) é o SIGNING_PLATFORM_A1_SECRET_REF.
      SEALER_PFX_ECNPJ_B64: ${SEALER_PFX_ECNPJ_B64:-}
      SEALER_PFX_ECNPJ_PASSWORD: ${SEALER_PFX_ECNPJ_PASSWORD:-}
    restart: unless-stopped
    # sem "ports": só acessível pela rede interna do compose

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE:-assinatura}
      POSTGRES_USER: ${DB_USERNAME:-assinatura_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  documents:
  backups:
